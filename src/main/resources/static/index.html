<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudStream Recorder</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0; padding: 1.5rem;
            font-family: system-ui, -apple-system, sans-serif;
            background: #111; color: #eee;
            display: flex; flex-direction: column; gap: 1rem;
            align-items: center;
        }
        h1 { font-size: 1.25rem; margin: 0; font-weight: 600; }
        video {
            width: 100%; max-width: 480px; border-radius: 12px;
            background: #000; aspect-ratio: 9/16; object-fit: cover;
        }
        .controls { display: flex; gap: 0.75rem; }
        button {
            padding: 0.85rem 1.75rem; font-size: 1rem; font-weight: 600;
            border: none; border-radius: 10px; cursor: pointer;
        }
        #startBtn { background: #2d7d46; color: #fff; }
        #stopBtn  { background: #a32b2b; color: #fff; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        #status {
            font-family: ui-monospace, monospace; font-size: 0.8rem;
            background: #1c1c1c; padding: 0.75rem 1rem; border-radius: 8px;
            width: 100%; max-width: 480px; box-sizing: border-box;
            min-height: 3rem; line-height: 1.5;
        }
        .stats { display: flex; gap: 1.5rem; font-size: 0.85rem; color: #999; }
        .stats b { color: #eee; font-variant-numeric: tabular-nums; }
    </style>
</head>
<body>

<h1>CloudStream — Live Recorder</h1>
<button id="switchCameraBtn">Switch Camera</button>
<!-- muted + playsinline are required for autoplay preview on iOS/Android -->
<video id="preview" autoplay muted playsinline></video>

<div class="controls">
    <button id="startBtn">Start Recording</button>
    <button id="stopBtn" disabled>Stop</button>
</div>

<div class="stats">
    <span>Chunks sent: <b id="chunkCount">0</b></span>
    <span>Uploaded: <b id="byteCount">0 KB</b></span>
</div>

<div id="status">Idle.</div>

<script src="/js/recorder.js"></script>
</body>
</html>
