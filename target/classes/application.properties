# ---------------------------------------------------------------
# CloudStream - application configuration
# ---------------------------------------------------------------

spring.application.name=cloudstream
server.port=8080

# Listen on all interfaces so the phone can reach the server over LAN Wi-Fi.
server.address=0.0.0.0

# --- Google Drive -----------------------------------------------
# Service-account key, loaded from the classpath.
# Google Drive OAuth 2.0 Credentials
drive.client.id=${DRIVE_CLIENT_ID}
drive.client.secret=${DRIVE_CLIENT_SECRET}
drive.refresh.token=${DRIVE_REFRESH_TOKEN}

# Drive folder ID that recordings land in. Take it from the folder's URL:
# drive.google.com/drive/folders/<THIS_PART>
# The folder must be SHARED WITH the service account's email address,
# otherwise every upload returns 404.
google.drive.target-folder-id=1yA8g2woBaqAKzIlYGDlDY6VdQCAlX1ju

# --- Upload tuning ----------------------------------------------
# Drive's mandatory chunk granularity. Do not change - the API rejects
# any non-final chunk that isn't an exact multiple of this.
cloudstream.upload.chunk-size=262144

# --- Logging ----------------------------------------------------
logging.level.com.cloudstream=DEBUG
logging.level.org.springframework.web.socket=INFO